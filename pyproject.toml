[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-ignore = [
    "BLE001",  # Broad except — intentional error-logging / UI teardown
    "DTZ",     # Naive datetime — desktop app, single timezone
    "S110",    # try-except-pass — intentional fallback patterns
    "SIM102",  # Nested if — minor style
    "B008",    # Function call in defaults — Qt overrides (QModelIndex())
    "PYI041",  # int|float → float — utility function
    "UP037",   # Quotes in annotations — forward references for circular imports
    "UP045",   # Optional[X] → X | None — style preference
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
disable_error_code = ["attr-defined", "call-overload", "call-arg", "override"]

[[tool.mypy.overrides]]
module = "diskwatch.ui.widget"
disable_error_code = ["assignment", "arg-type"]

[[tool.mypy.overrides]]
module = "diskwatch.ui.panel"
disable_error_code = ["assignment", "index"]
